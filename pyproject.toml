[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scibs"
version = "0.1.0"
description = "Migrate SCIBS codebase to Python + Matlab support"
requires-python = ">=3.12"
authors = [
    { name = "Blake Moody", email = "blake.moody001@umb.edu" },
]
dependencies = [
    "matplotlib>=3.10.8",
    # Used directly and pervasively throughout the package. It arrives
    # transitively via scipy/pyvista anyway, but relying on that means an
    # install can break from a change in someone else's dependency tree.
    "numpy>=1.26",
    "pyvista>=0.47.1",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"] # package lives under src/
